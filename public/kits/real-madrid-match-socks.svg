<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sockBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sockBg)"/>
  <circle cx="300" cy="300" r="230" fill="#ffffff" opacity="0.08"/>

  <g transform="translate(220, 80)">
    <!-- Sock Body -->
    <path d="M 40,30 L 120,30 L 120,320 Q 150,370 210,380 Q 220,430 180,440 Q 90,440 40,370 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Ribbed Cuff -->
    <rect x="40" y="30" width="80" height="40" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <line x1="40" y1="42" x2="120" y2="42" stroke="#ffffff" stroke-width="3"/>
    <line x1="40" y1="56" x2="120" y2="56" stroke="#ffffff" stroke-width="3"/>

    <!-- Anti-Slip / Grip Hexagon Pads -->
    <g fill="#1e293b" opacity="0.85">
      <polygon points="120,400 126,396 132,400 132,408 126,412 120,408"/>
      <polygon points="140,400 146,396 152,400 152,408 146,412 140,408"/>
      <polygon points="160,400 166,396 172,400 172,408 166,412 160,408"/>
      <polygon points="130,415 136,411 142,415 142,423 136,427 130,423"/>
      <polygon points="150,415 156,411 162,415 162,423 156,427 150,423"/>
    </g>

    <!-- Team / Wordmark -->
    <text x="80" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#1e293b" letter-spacing="1.5">RMCF</text>
  </g>

  <!-- Title Pill -->
  <g transform="translate(300, 530)">
    <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#0f172a"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#00e676" letter-spacing="1">REAL MADRID MATCH SOCKS</text>
  </g>
</svg>