<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="soleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#00e676" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgG)"/>
  <circle cx="300" cy="300" r="220" fill="#f43f5e" opacity="0.12"/>

  <g filter="url(#bShadow)" transform="translate(40, 50)">
    <!-- Dynamic Fit Collar -->
    <path d="M 190,160 Q 230,130 270,160 L 260,250 L 180,250 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="230" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#94a3b8" letter-spacing="1">FUZIONFIT 360</text>

    <!-- Upper Chassis -->
    <path d="M 120,380 C 120,340 150,250 220,240 C 290,230 380,270 450,330 C 490,365 510,400 480,420 C 420,430 180,430 120,410 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>

    <!-- Speed Graphic Ribs -->
    <path d="M 230,260 Q 320,300 420,360" stroke="#fb7185" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 210,290 Q 300,330 400,390" stroke="#fb7185" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 190,320 Q 280,360 380,410" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Chrome FG Soleplate -->
    <path d="M 100,410 Q 300,435 480,410 L 485,435 Q 300,455 95,430 Z" fill="url(#soleG)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Studs / Cleats -->
    <polygon points="120,430 140,430 135,465 125,465" fill="#fb7185"/>
    <polygon points="160,432 180,432 175,465 165,465" fill="#fb7185"/>
    <polygon points="380,432 400,432 395,465 385,465" fill="#fb7185"/>
    <polygon points="430,428 450,428 445,465 435,465" fill="#fb7185"/>

    <!-- Brand Emblem -->
    <text x="300" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3" opacity="0.95">PUMA FUTURE</text>
  </g>

  <!-- Title Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#0f172a" letter-spacing="1.5">PUMA FUTURE 7 ULTIMATE</text>
  </g>
</svg>