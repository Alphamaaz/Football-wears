<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="jerseyShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="15%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Studio Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <circle cx="300" cy="300" r="240" fill="#ffffff" opacity="0.75"/>

  <!-- Jersey Silhouette Group with Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Left Sleeve -->
    <path d="M 210,120 L 80,210 L 120,290 L 195,235 Z" fill="#111111" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left Sleeve Cuff -->
    <path d="M 80,210 L 120,290 L 110,295 L 70,215 Z" fill="#111111" opacity="0.9"/>

    <!-- Right Sleeve -->
    <path d="M 390,120 L 520,210 L 480,290 L 405,235 Z" fill="#111111" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right Sleeve Cuff -->
    <path d="M 520,210 L 480,290 L 490,295 L 530,215 Z" fill="#111111" opacity="0.9"/>

    <!-- Main Torso Body -->
    <path d="M 210,120 Q 300,160 390,120 L 415,240 L 400,530 Q 300,545 200,530 L 185,240 Z" fill="#FB090B" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Optional Stripes & Graphic Patterns -->
    <g clip-path="url(#torsoClip)">
      <clipPath id="torsoClip">
        <path d="M 210,120 Q 300,160 390,120 L 415,240 L 400,530 Q 300,545 200,530 L 185,240 Z"/>
      </clipPath>
      <rect x="220" y="120" width="32" height="420" fill="#111111" opacity="1"/><rect x="284" y="120" width="32" height="420" fill="#111111" opacity="1"/><rect x="348" y="120" width="32" height="420" fill="#111111" opacity="1"/>
      
      <!-- Realistic Fabric Shading Overlay -->
      <path d="M 210,120 Q 300,160 390,120 L 415,240 L 400,530 Q 300,545 200,530 L 185,240 Z" fill="url(#jerseyShade)" pointer-events="none"/>
    </g>

    <!-- Collar -->
    <path d="M 235,120 Q 300,185 365,120 Q 300,140 235,120 Z" fill="#111111" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M 245,120 Q 300,175 355,120 Q 300,145 245,120 Z" fill="#0f172a" opacity="0.15"/>
  </g>

  <!-- Brand Logo (Right Chest) -->
  <g transform="translate(245, 205)">
    
      <path d="M 2,12 Q 10,2 24,4 Q 30,8 26,16 Q 16,14 10,18 Z" fill="#ffffff"/>
    
  </g>

  <!-- Club Crest (Left Chest) -->
  <g transform="translate(330, 195)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="19" fill="#FB090B"/>
    <text x="20" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="-0.5">ACM</text>
  </g>

  <!-- Center Sponsor Wordmark -->
  <g transform="translate(300, 310)">
    <rect x="-85" y="-18" width="170" height="36" rx="6" fill="#000000" opacity="0.06"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" letter-spacing="1.5">EMIRATES</text>
  </g>

  <!-- Competition / Badge Ribbon -->
  
  <g transform="translate(300, 470)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#0f172a" opacity="0.85"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#00e676" letter-spacing="1">125 YEARS ROSSONERI</text>
  </g>
  
</svg>